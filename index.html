function flash(t){hint.textContent=t;hint.style.opacity='1';clearTimeout(flash.t);flash.t=setTimeout(()=>{hint.textContent='Drag brick to move · drag rings to rotate · tap brick toggles rings · empty space or two fingers = camera';hint.style.opacity='.78'},2600)}
function camAxes(){const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0);right.y=0;if(right.lengthSq()<.0001)right.set(-Math.sin(camAngle),0,Math.cos(camAngle));right.normalize();const fwd=new THREE.Vector3();camera.getWorldDirection(fwd);fwd.y=0;if(fwd.lengthSq()<.0001)fwd.set(-Math.cos(camAngle),0,-Math.sin(camAngle));fwd.normalize();return{right,fwd}}
function pickTarget(e){const p=pt(e);pointer.x=p.clientX/innerWidth*2-1;pointer.y=-(p.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);if(ghost&&ghost.visible){const hits=raycaster.intersectObject(ghost,false);if(hits.length)return'brick'}if(gizmo&&ringsVisible&&gizmo.visible){const hits=raycaster.intersectObjects(gizmo.children.filter(o=>o.userData.hit),false);if(hits[0])return hits[0].object.userData.axis}return null}
let dragging=false,lastX=0,lastY=0,two=false,pinch=0,lastAngle=0,lastCentroidY=0,brickDragging=false,brickTapStart=null,usingTouch=false,ringLastAngle=null,ringDragFrame=null;
function pt(e){return e.touches?e.touches[0]:e}
function worldPerPixel(){return 2*camRadius*Math.tan(camera.fov*Math.PI/360)/innerHeight}
function axisVec(axis){return new THREE.Vector3(axis==='x'?1:0,axis==='y'?1:0,axis==='z'?1:0)}
function wrapPi(a){if(a>Math.PI)a-=2*Math.PI;else if(a<-Math.PI)a+=2*Math.PI;return a}
function buildRingDragFrame(axis){const axW=axisVec(axis).applyQuaternion(brickQ).normalize();let uD,vD;if(axis==='x'){uD=new THREE.Vector3(0,1,0);vD=new THREE.Vector3(0,0,1)}else if(axis==='y'){uD=new THREE.Vector3(0,0,1);vD=new THREE.Vector3(1,0,0)}else{uD=new THREE.Vector3(1,0,0);vD=new THREE.Vector3(0,1,0)}uD.applyQuaternion(brickQ).projectOnPlane(axW).normalize();vD.applyQuaternion(brickQ).projectOnPlane(axW).normalize();return{axis,plane:new THREE.Plane().setFromNormalAndCoplanarPoint(axW,ghost.position),uD,vD}}
function ringAngleAt(px,py,frame){pointer.x=px/innerWidth*2-1;pointer.y=-(py/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=new THREE.Vector3();if(!raycaster.ray.intersectPlane(frame.plane,hit))return null;const d=hit.sub(ghost.position);return Math.atan2(d.dot(frame.vD),d.dot(frame.uD))}
function down(e){if(e.touches){usingTouch=true;if(e.touches.length===2){two=true;const t0=e.touches[0],t1=e.touches[1];pinch=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);lastAngle=Math.atan2(t1.clientY-t0.clientY,t1.clientX-t0.clientX);lastCentroidY=(t0.clientY+t1.clientY)/2;dragging=true;brickDragging=false;activeAxis=null;setGizmoOpacity(null);return}}else if(usingTouch)return;const p=pt(e);lastX=p.clientX;lastY=p.clientY;const target=pickTarget(e);if(target==='brick'){brickDragging=true;brickTapStart={x:p.clientX,y:p.clientY,time:Date.now(),moved:false};e.preventDefault?.()}else if(target){activeAxis=target;setGizmoOpacity(activeAxis);ringDragFrame=buildRingDragFrame(activeAxis);ringLastAngle=ringAngleAt(p.clientX,p.clientY,ringDragFrame);flash('Rotating '+activeAxis.toUpperCase()+' axis');e.preventDefault?.()}if(e.pointerId!==undefined)try{renderer.domElement.setPointerCapture(e.pointerId)}catch(err){}dragging=true}
function move(e){if(!dragging)return;if(e.touches){usingTouch=true;if(e.touches.length===2){two=true;const t0=e.touches[0],t1=e.touches[1];const d=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);const a=Math.atan2(t1.clientY-t0.clientY,t1.clientX-t0.clientX);const cy=(t0.clientY+t1.clientY)/2;const wp=worldPerPixel();if(pinch&&d>0)camRadius=THREE.MathUtils.clamp(camRadius*pinch/d,6,40);const da=wrapPi(a-lastAngle);camAngle+=da;camHeight=THREE.MathUtils.clamp(camHeight-(cy-lastCentroidY)*wp,0,60);pinch=d;lastAngle=a;lastCentroidY=cy;e.preventDefault?.();return}}else if(usingTouch)return;const p=pt(e);if(two){lastX=p.clientX;lastY=p.clientY;two=false;return}const dx=p.clientX-lastX,dy=p.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>1){if(brickDragging){if(brickTapStart&&!brickTapStart.moved){if(Math.hypot(p.clientX-brickTapStart.x,p.clientY-brickTapStart.y)>8)brickTapStart.moved=true}if(brickTapStart?.moved){const {right,fwd}=camAxes(),scale=.012*(camRadius/10);targetX=THREE.MathUtils.clamp(targetX+(right.x*dx-fwd.x*dy)*scale,-3.4,3.4);targetZ=THREE.MathUtils.clamp(targetZ+(right.z*dx-fwd.z*dy)*scale,-2.9,2.9);updateGhost()}e.preventDefault?.()}else if(activeAxis&&ringDragFrame){const a=ringAngleAt(p.clientX,p.clientY,ringDragFrame);if(a!==null&&ringLastAngle!==null){let da=THREE.MathUtils.clamp(wrapPi(a-ringLastAngle),-.24,.24);ringLastAngle=a;brickQ.multiply(new THREE.Quaternion().setFromAxisAngle(axisVec(activeAxis),da)).normalize();updateGhost()}e.preventDefault?.()}else{camAngle-=dx*2*Math.tan(camera.fov*Math.PI/360)/innerHeight;camHeight=THREE.MathUtils.clamp(camHeight-dy*worldPerPixel(),0,60)}}lastX=p.clientX;lastY=p.clientY}
function up(e){if(e.touches){if(e.touches.length===0)usingTouch=false}else{usingTouch=false;if(e.pointerId!==undefined&&renderer.domElement.hasPointerCapture?.(e.pointerId))try{renderer.domElement.releasePointerCapture(e.pointerId)}catch(err){}}if(brickDragging&&brickTapStart&&!brickTapStart.moved){ringsVisible=!ringsVisible;if(gizmo)gizmo.visible=ringsVisible;flash(ringsVisible?'Rotation rings on':'Rotation rings off — tap brick to show')}dragging=false;two=false;pinch=0;activeAxis=null;brickDragging=false;brickTapStart=null;ringLastAngle=null;ringDragFrame=null;setGizmoOpacity(null)}
renderer.domElement.addEventListener('touchstart',down,{passive:false});renderer.domElement.addEventListener('touchmove',move,{passive:false});renderer.domElement.addEventListener('touchend',up,{passive:false});renderer.domElement.addEventListener('pointerdown',down);renderer.domElement.addEventListener('pointermove',move);renderer.domElement.addEventListener('pointerup',up);renderer.domElement.addEventListener('pointercancel',up);
levelBtn.onclick=()=>{const yaw=new THREE.Euler().setFromQuaternion(brickQ,'YXZ').y;brickQ.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.round(yaw/(Math.PI/2))*Math.PI/2);updateGhost()};placeBtn.onclick=place;resetBtn.onclick=reset;continueBtn.onclick=continueGame;overlayResetBtn.onclick=reset;recenterBtn.onclick=()=>{camAngle=Math.atan2(ghost.position.z,ghost.position.x);camHeight=THREE.MathUtils.clamp(ghost.position.y+2,0,60)};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let acc=0,last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;acc+=dt;while(acc>=1/60){world.step();acc-=1/60}sync();if(cleanup){const removed=removeGroundedBricks();if(removed){cleanupQuiet=.9}else{cleanupQuiet-=dt;if(cleanupQuiet<=0){cleanup=false;agnej=false;msg.style.display='none';flash('Continue · collapse score: '+collapseScore)}}}const moving=movingBricksCount();if(moving>0){if(!settling)settling=true}else if(settling){settling=false;if(!agnej&&!cleanup)flash('Settled — place next brick')}settlingAmount=THREE.MathUtils.lerp(settlingAmount,settling?1:0,.05);const top=Math.max(1.5,...items.map(it=>it.mesh.position.y));if(structureTop()+2>camHeight)camHeight=structureTop()+2;if(!dragging)camAngle+=dt*.3*settlingAmount;if(ghost){const gOp=THREE.MathUtils.lerp(ghostMat.opacity,.72*(1-settlingAmount),.1);ghostMat.opacity=gOp;ghostSideMat.opacity=gOp;invalidMat.opacity=gOp;invalidSideMat.opacity=gOp;ghost.visible=gOp>.01}if(gizmo){const tBase=ringsVisible?.95*(1-settlingAmount):0;for(const r of gizmo.children){if(!r.userData.visibleRing)continue;r.material.uniforms.uBaseOpacity.value=THREE.MathUtils.lerp(r.material.uniforms.uBaseOpacity.value,tBase,.1);r.material.uniforms.uFadeOpacity.value=THREE.MathUtils.lerp(r.material.uniforms.uFadeOpacity.value,tBase/19,.1)}gizmo.visible=ringsVisible&&settlingAmount<.99}let tlx=0,tly=1.2,tlz=0;if(settlingAmount>.01){const c=bricksCentroid();tlx=c.x;tly=c.y;tlz=c.z;const b=towerBounds();camRadius=THREE.MathUtils.lerp(camRadius,Math.max(camRadius,b.maxR+3),.04*settlingAmount)}else if(ghost){tlx=ghost.position.x;tly=ghost.position.y;tlz=ghost.position.z}lookAtVec.lerp({x:tlx,y:tly,z:tlz},.05);if(settlingAmount<.5&&ghost&&ghost.visible){if(!brickInView())recenterBtn.classList.add('show');else recenterBtn.classList.remove('show')}else recenterBtn.classList.remove('show');camera.position.x=Math.cos(camAngle)*camRadius;camera.position.z=Math.sin(camAngle)*camRadius;camera.position.y=THREE.MathUtils.lerp(camera.position.y,camHeight,.08);camera.lookAt(lookAtVec.x,lookAtVec.y,lookAtVec.z);updateGizmoUniforms();renderer.render(scene,camera)}reset();requestAnimationFrame(animate);
</script>
